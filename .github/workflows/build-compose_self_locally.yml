name: build-compose_self_locally

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      openwrt_source:
        description: 'OpenWrt source'
        required: true
        default: immortalwrt/immortalwrt
        type: choice
        options:
        - immortalwrt/immortalwrt
        - DHDAXCW/immortalwrt
        - MilesPoupart/immortalwrt
      openwrt_branch:
        description: 'OpenWrt branch'
        required: true
        default: 'openwrt-24.10'
        type: choice
        options:
        - 'master'
        - 'openwrt-23.05'
        - 'openwrt-24.10'
        - 'openwrt-25.12'
      use_machine:
        description: 'Machine'
        required: true
        default: '12900F'
        type: choice
        options:
        - '7700HQ'
        - '12900F'
      compile_version:
        description: 'Version'
        required: true
        default: docker
        type: choice
        options:
        - docker
        - full
      task_setting:
        description: 'Task Settings'
        required: true
        default : 'build-compose'
        type: choice
        options:
        - 'build-compose'
        - 'build-only'
        - 'source-only'
      config_file:
        description: 'Config File'
        required: true
        default: configs/immortal/merged.config
        type: choice
        options:
        - configs/immortal/merged.config
        - configs/immortal/immortal.config
  # schedule:
  #   - cron: 0 17 * * *
  # watch:
  #   types: started

env:
  REPO_URL: https://github.com/${{ inputs.openwrt_source }}
  CONFIG_FILE: ${{ inputs.config_file }}
  DIY_SH: scripts/immortal.sh
  UPLOAD_RELEASE: true

jobs:

  DownloadSourceCode:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.use_machine }}"]
    outputs:
      OPENWRTROOT: ${{ steps.set_output.outputs.OPENWRTROOT }}

    steps:
    - name: Show choice
      run: |
        echo "OpenWrt Source=${{ inputs.openwrt_source }}"
        echo "OpenWrt Branch=${{ inputs.openwrt_branch }}"
        echo "Compile Version=${{ inputs.compile_version }}"
        echo "Task settings=${{ inputs.task_setting }}"
        echo "Compile machine=${{ inputs.use_machine }}"
        echo "Config File=${{ inputs.config_file }}"

    - name: Check openwrt directory
      if: ${{ inputs.task_setting == 'build-only' }}
      id: check_directory
      run: |
        if [ -d "openwrt" ]; then
          cd openwrt
          echo "OPENWRTROOT=$PWD" >> $GITHUB_ENV
        else
          echo "Error: openwrt folder does not exist."
          exit 1
        fi
    
    - name: Checkout
      if: inputs.task_setting != 'build-only'
      uses: actions/checkout@v5

    - name: Initialization Environment
      if: inputs.task_setting != 'build-only'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'
        free -h
        uname -a
        [ -f /proc/version ] && cat /proc/version
        [ -f /etc/issue.net ] && cat /etc/issue.net
        [ -f /etc/issue ] && cat /etc/issue
        ulimit -a
        
    - name: Clone Source Code
      if: inputs.task_setting != 'build-only'
      run: |
        df -hT $PWD
        git clone -b ${{ inputs.openwrt_branch }} $REPO_URL openwrt

    - name: Update Feeds
      if: inputs.task_setting != 'build-only'
      id: update
      run: |
        cd openwrt
        echo "OPENWRTROOT=$PWD" >> $GITHUB_ENV
        echo "OPENWRTROOT=$PWD" >> $GITHUB_OUTPUT
        mkdir customfeeds
        git clone --depth=1 -b ${{ inputs.openwrt_branch }} https://github.com/immortalwrt/packages customfeeds/packages
        git clone --depth=1 -b ${{ inputs.openwrt_branch }} https://github.com/immortalwrt/luci customfeeds/luci
        chmod +x ../scripts/*.sh
        ../scripts/feeds_settings.sh

    - name: MOD index file
      if: inputs.task_setting != 'build-only'
      run: |
        cd $OPENWRTROOT/customfeeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include
        sed -i '/_('\''Load Average'\''),/i\\t\t\t_('\''Github'\''),           E('\''a'\'', { '\''href'\'': '\''https://github.com/MilesPoupart/OpenWRT_x86_x64'\'' }, [ _('\''固件下载'\'') ]),' 10_system.js

    - name: Install Feeds
      if: inputs.task_setting != 'build-only'
      run: |
        cd $OPENWRTROOT
        ./scripts/feeds install -a
        
    - name: Load Custom Configuration
      if: inputs.task_setting != 'build-only'
      run: |
        [ -e files ] && mv files $OPENWRTROOT/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE $OPENWRTROOT/.config
        chmod +x scripts/*.sh
        cd $OPENWRTROOT
        ../$DIY_SH
        ../scripts/preset-clash-core.sh amd64-v2
        ../scripts/preset-terminal-tools.sh
        if [ "${{ inputs.compile_version }}" == "docker" ]; then
            echo '
        CONFIG_DOCKER_CGROUP_OPTIONS=y
        CONFIG_DOCKER_NET_MACVLAN=y
        CONFIG_DOCKER_STO_EXT4=y
        CONFIG_PACKAGE_docker=y
        CONFIG_PACKAGE_docker-compose=y
        CONFIG_PACKAGE_dockerd=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y
        CONFIG_PACKAGE_luci-lib-docker=y
        ' >> .config       
        fi
        make defconfig
        
    - name: Download Package
      if: inputs.task_setting != 'build-only'
      id: package
      run: |
        cd $OPENWRTROOT
        # cat .config
        mkdir -p dl
        rm -f dl/aliyundrive-webdav-v2.3.3.x86_64-unknown-linux-musl.tar.gz
        rm -f dl/aliyundrive-webdav-v2.3.3.x86_64-unknown-linux-musl.tar.gz.sha256
        rm -f dl/quickfile-1.0.5.tar.gz
        wget -P dl https://r2.cooluc.com/source/quickfile-1.0.5.tar.gz
        wget -P dl https://github.com/messense/aliyundrive-webdav/releases/download/v2.3.3/aliyundrive-webdav-v2.3.3.x86_64-unknown-linux-musl.tar.gz 
        wget -P dl https://github.com/messense/aliyundrive-webdav/releases/download/v2.3.3/aliyundrive-webdav-v2.3.3.x86_64-unknown-linux-musl.tar.gz.sha256
        make download -j16
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c ! -name '*.sha256' -exec rm -f {} \;
  
    - name: Set OPENWRTROOT output
      id: set_output
      run: |
        echo "OPENWRTROOT=$OPENWRTROOT" >> $GITHUB_ENV
        echo "OPENWRTROOT=$OPENWRTROOT" >> $GITHUB_OUTPUT 

  CompileToolchain:
    if: inputs.task_setting != 'source-only'
    runs-on: [self-hosted, Linux, X64, "${{ inputs.use_machine }}"]
    timeout-minutes: 1440
    needs: [DownloadSourceCode]

    steps:
    - name: Compile toolchain
      id: compile
      run: | 
        cd ${{ needs.DownloadSourceCode.outputs.OPENWRTROOT }}
        echo -e "$(nproc) thread compile"
        make tools/compile -j$(nproc) || make tools/compile -j1 V=s
        make toolchain/compile -j$(nproc) || make toolchain/compile -j1 V=s
        make target/compile -j$(nproc) || make target/compile -j1 V=s IGNORE_ERRORS=1
        make diffconfig
  
  CompileFirmware:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.use_machine }}"]
    timeout-minutes: 1440
    needs: [DownloadSourceCode, CompileToolchain]

    outputs:
      OPENWRTROOT: ${{ steps.compile.outputs.OPENWRTROOT }}
      PLATFORM: ${{ steps.compile.outputs.PLATFORM }}
      TARGET: ${{ steps.compile.outputs.TARGET }}
      SUBTARGET: ${{ steps.compile.outputs.SUBTARGET }}
      FIRMWARE: ${{ steps.compile.outputs.FIRMWARE }}
      GENERATE_STATUS: ${{ steps.generate.outputs.GENERATE_STATUS }}
      RELEASE_DATE: ${{ steps.tag.outputs.RELEASE_DATE }}
      RELEASE_TAG: ${{ steps.tag.outputs.RELEASE_TAG }}
      RELEASE_STATUS: ${{ steps.tag.outputs.RELEASE_STATUS }}
      KERNEL_VERSION: ${{ steps.generate.outputs.KERNEL_VERSION }}

    steps:

    - name: Compile package
      id: compile
      run: |
        cd ${{ needs.DownloadSourceCode.outputs.OPENWRTROOT }}
        OPENWRTROOT=$(pwd)
        echo "OPENWRTROOT=$OPENWRTROOT" >> $GITHUB_ENV
        echo "OPENWRTROOT=$OPENWRTROOT" >> $GITHUB_OUTPUT
        echo -e "$(nproc) thread compile"
        make package/compile -j$(nproc) IGNORE_ERRORS=1 || make package/compile -j1 V=s IGNORE_ERRORS=1
        make package/index
        cd $OPENWRTROOT/bin/packages/*
        PLATFORM=$(basename `pwd`)
        echo "PLATFORM=$PLATFORM" >> $GITHUB_ENV
        echo "PLATFORM=$PLATFORM" >> $GITHUB_OUTPUT
        cd $OPENWRTROOT/bin/targets/*
        TARGET=$(basename `pwd`)
        echo "TARGET=$TARGET" >> $GITHUB_ENV
        echo "TARGET=$TARGET" >> $GITHUB_OUTPUT
        cd *
        SUBTARGET=$(basename `pwd`)
        echo "SUBTARGET=$SUBTARGET" >> $GITHUB_ENV
        echo "SUBTARGET=$SUBTARGET" >> $GITHUB_OUTPUT
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "FIRMWARE=$PWD" >> $GITHUB_OUTPUT
        echo "COMPILE_STATUS=success" >> $GITHUB_OUTPUT

    - name: Generate Firmware
      if: steps.compile.outputs.COMPILE_STATUS == 'success'
      id: generate
      run: |
        cd configs/opkg
        sed -i "s/subtarget/$SUBTARGET/g" distfeeds*.conf
        sed -i "s/target\//$TARGET\//g" distfeeds*.conf
        sed -i "s/platform/$PLATFORM/g" distfeeds*.conf
        cd $OPENWRTROOT
        mkdir -p files/etc/uci-defaults/
        cp ../scripts/init-settings.sh files/etc/uci-defaults/99-init-settings
        make package/install -j$(nproc) || make package/install -j1 V=s
        make target/install -j$(nproc) || make target/install -j1 V=s
        pushd bin/targets/x86/64
        kernelv=`cat immortalwrt-x86-64-generic.manifest | grep 'kernel - ' | sed -n 's/kernel - \([0-9.]*\).*/\1/p'`
        echo "KERNEL_VERSION=$kernelv" >> $GITHUB_OUTPUT
        rm -rf immortalwrt-x86-64-generic-kernel.bin
        rm -rf immortalwrt-x86-64-generic-rootfs.tar.gz
        rm -rf immortalwrt-x86-64-generic-squashfs-rootfs.img.gz
        rm -rf immortalwrt-x86-64-generic-ext4-rootfs.img.gz
        rm -rf immortalwrt-x86-64-generic-squashfs-combined-efi.vmdk
        rm -rf immortalwrt-x86-64-generic-ext4-combined-efi.vmdk.gz
        rm -rf immortalwrt-x86-64-generic-ext4-combined.img.gz
        rm -rf immortalwrt-x86-64-generic-squashfs-combined.img.gz
        mv immortalwrt-x86-64-generic.manifest ${{ inputs.compile_version }}-x86-64-generic.manifest
        mv config.buildinfo ${{ inputs.compile_version }}-config.buildinfo
        mv immortalwrt-x86-64-generic-squashfs-combined-efi.img.gz ${{ inputs.compile_version }}-x86-64-squashfs-efi.img.gz
        mv immortalwrt-x86-64-generic-ext4-combined-efi.img.gz ${{ inputs.compile_version }}-x86-64-ext4-efi.img.gz
        popd
        mkdir -p server/web/snapshots/targets/$TARGET/$SUBTARGET
        cp -r $OPENWRTROOT/bin/packages server/web/snapshots
        cp -r $OPENWRTROOT/bin/targets/$TARGET/$SUBTARGET/packages server/web/snapshots/targets/$TARGET/$SUBTARGET
        mv server packages-server
        zip -qrm ${{ inputs.compile_version }}-packages-server.zip packages-server
        mv ${{ inputs.compile_version }}-packages-server.zip $OPENWRTROOT/bin/targets/$TARGET/$SUBTARGET
        make checksum
        mv bin/targets/x86/64/sha256sums bin/targets/x86/64/${{ inputs.compile_version }}-sha256sums
        echo "GENERATE_STATUS=success" >> $GITHUB_OUTPUT

        
    - name: Generate release tag
      id: tag
      if: steps.generate.outputs.GENERATE_STATUS == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
          echo "RELEASE_TAG=$(date +"%Y.%m.%d")-immortalwrt" >> $GITHUB_OUTPUT
          echo "RELEASE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "本次编译的openwrt源：${{ inputs.openwrt_source }}
                后台地址：192.168.4.1
                full   = 全插件
                docker = 带docker" >> release.txt
          echo "RELEASE_STATUS=success" >> $GITHUB_OUTPUT

  UploadFirmware:
    runs-on: [self-hosted, Linux, X64, "${{ inputs.use_machine }}"]
    timeout-minutes: 1440
    needs: [CompileFirmware]

    steps:

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: needs.CompileFirmware.outputs.RELEASE_STATUS == 'success' && !cancelled() && env.UPLOAD_RELEASE == 'true'
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          name: ${{ needs.CompileFirmware.outputs.RELEASE_DATE }} x86-64-Linux-${{ needs.CompileFirmware.outputs.KERNEL_VERSION }} 固件
          tag_name: ${{ needs.CompileFirmware.outputs.RELEASE_TAG }}
          body_path: release.txt
          files: ${{ needs.CompileFirmware.outputs.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 1

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
          keep_latest: 20
          delete_tags: true
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
